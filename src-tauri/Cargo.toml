[package]
name = "klarstock"
version = "1.0.0"
description = "KlarStock — gestion de stock 100 % hors ligne"
authors = ["KlarStock"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "klarstock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
